# Set DB_PASSWORD in the environment before starting the application.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
spring.application.name=complaint-management

# This optional age-based marker is operational configuration, not an SLA.
# 0 disables overdue tracking. When enabled, the backend clock and active statuses determine it.
complaint.overdue-after-days=${COMPLAINT_OVERDUE_AFTER_DAYS:0}

ai.python-command=${AI_PYTHON_COMMAND:python}
ai.script-path=${AI_SCRIPT_PATH:ai/predict_complaint.py}
ai.process-timeout-seconds=${AI_PROCESS_TIMEOUT_SECONDS:30}
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
